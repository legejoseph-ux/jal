<style>

<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw === null ? null : { key, value: raw };
    } catch (err) {
      console.error('storage.get failed:', err);
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value };
    } catch (err) {
      console.error('storage.set failed:', err);
      return null;
    }
  }
};

const CHEAT_SHEET = {
  editor1: {
    title: 'For Jordan',
    subtitle: 'Anchor mode; growth & calibration',
    items: [
      { id: 's1', q: 'What are you most proud of from this week?', kind: 'growth' },

      { id: 's4', q: "How's the workload — sustainable, or starting to fray?", kind: 'wellbeing' },

    items: [

const KIND_COLORS = { work: '#7a9b8e', growth: '#d4a574', wellbeing: '#c4956c' };

const INSPIRATION_QUOTES = [
  { text: "Editing is where movies are made or broken. It's the only craft in cinema that has no precedent in any other art form.", author: "Walter Murch" },
  { text: "In the end, editing is nothing more than the manipulation of time.", author: "Walter Murch" },

  { text: "Cut out the parts people skip.", author: "Elmore Leonard" },
  { text: "Story is about something that is important to you, the writer. The more intensely specific your story, the more it resonates universally.", author: "Robert McKee" },

function pickDailyQuote(dateStr) {
  let hash = 0;
  for (let i = 0; i < dateStr.length; i++) {
    hash = (hash * 31 + dateStr.charCodeAt(i)) >>> 0;
  }
  return INSPIRATION_QUOTES[hash % INSPIRATION_QUOTES.length];
}
const STORAGE_KEY = 'jal-data-v2';
const NAMES_KEY = 'jal-names-v2';
const PROJECTS_KEY = 'jal-projects-v2';
const NOTES_KEY = 'jal-notes-v1';
const INSPIRATION_KEY = 'jal-inspiration-v1';
const DISCUSSION_KEY = 'jal-discussion-v1';
const DISCUSSION_TAGS = [
  { id: 'skill', label: 'Skill gap', color: '#d4a574' },
  { id: 'ownership', label: 'Ownership', color: '#c4956c' },
  { id: 'communication', label: 'Communication', color: '#8a9bc4' },
  { id: 'other', label: 'Other', color: '#a8a092' },
];
const SCHEDULE_START_HOUR = 8;
const SCHEDULE_START_MIN = 30;
const SCHEDULE_END_HOUR = 16;
const SCHEDULE_END_MIN = 30;

function buildScheduleSlots() {
  const slots = [];
  let h = SCHEDULE_START_HOUR;
  let m = SCHEDULE_START_MIN;
  const label12 = (hh, mm) => {
    const period = hh >= 12 ? 'PM' : 'AM';
    let h12 = hh % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ':' + (mm < 10 ? '0' + mm : mm) + ' ' + period;
  };
  while (h < SCHEDULE_END_HOUR || (h === SCHEDULE_END_HOUR && m < SCHEDULE_END_MIN)) {
    let nextM = m + 60;
    let nextH = h + Math.floor(nextM / 60);
    nextM = nextM % 60;
    if (nextH > SCHEDULE_END_HOUR || (nextH === SCHEDULE_END_HOUR && nextM > SCHEDULE_END_MIN)) {
      nextH = SCHEDULE_END_HOUR;
      nextM = SCHEDULE_END_MIN;
    }
    slots.push({ id: h + '-' + m, label: label12(h, m) + ' - ' + label12(nextH, nextM) });
    h = nextH;
    m = nextM;
  }
  return slots;
}

const SCHEDULE_SLOTS = buildScheduleSlots();
const STATUSES = [
  { id: 'active', label: 'Active', color: '#7a9b8e' },
  { id: 'planning', label: 'Planning', color: '#8a9bc4' },
  { id: 'paused', label: 'Paused', color: '#c4956c' },
  { id: 'review', label: 'In Review', color: '#d4a574' },
  { id: 'done', label: 'Complete', color: '#5a7a6c' },
];

const navBtn = { background: 'transparent', border: '1px solid #2a2722', borderRadius: '2px', padding: '8px 10px', color: '#a8a092', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' };

const TRACKS = [
  { id: 'self', label: 'Yours', color: '#a8a092' },
  { id: 'editor1', label: 'Jordan', color: '#7a9b8e' },
  { id: 'editor2', label: 'Dakota', color: '#c4956c' },
  { id: 'pastoral', label: 'Pastoral', color: '#d4a574' },
  { id: 'prep', label: '1:1 Prep', color: '#8a9bc4' },
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function dayName(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
}

function App() {
  const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
  const [data, setData] = useState({});
  const [names, setNames] = useState({ editor1: 'Jordan', editor2: 'Dakota' });
  const [activeTrack, setActiveTrack] = useState('self');
  const [newTask, setNewTask] = useState('');
  const [loading, setLoading] = useState(true);
  const [editingName, setEditingName] = useState(null);
  const [listening, setListening] = useState(null);
  const [projects, setProjects] = useState([]);
  const [notes, setNotes] = useState({});
  const [inspirationLinks, setInspirationLinks] = useState([]);
  const [newInspiration, setNewInspiration] = useState('');
  const [discussionQueue, setDiscussionQueue] = useState({});
  const [view, setView] = useState('daily');
  const [activeProjectId, setActiveProjectId] = useState(null);
  const recognitionRef = useRef(null);
  const speechSupported = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
  const isFirstLoad = useRef(true);

  useEffect(() => {
    (async () => {
      try {
        const s = await storage.get(STORAGE_KEY);
        if (s?.value) setData(JSON.parse(s.value));
      } catch (err) {
        console.error('Failed to load task data:', err);
      }
      try {
        const n = await storage.get(NAMES_KEY);
        if (n?.value) setNames(JSON.parse(n.value));
      } catch (err) {
        console.error('Failed to load names:', err);
      }
      try {
        const p = await storage.get(PROJECTS_KEY);
        if (p?.value) setProjects(JSON.parse(p.value));
      } catch (err) {
        console.error('Failed to load projects:', err);
      }
      try {
        const nt = await storage.get(NOTES_KEY);
        if (nt?.value) setNotes(JSON.parse(nt.value));
      } catch (err) {
        console.error('Failed to load notes:', err);
      }
      try {
        const il = await storage.get(INSPIRATION_KEY);
        if (il?.value) setInspirationLinks(JSON.parse(il.value));
      } catch (err) {
        console.error('Failed to load inspiration links:', err);
      }
      try {
        const dq = await storage.get(DISCUSSION_KEY);
        if (dq?.value) setDiscussionQueue(JSON.parse(dq.value));
      } catch (err) {
        console.error('Failed to load discussion queue:', err);
      }
      setLoading(false);
      setTimeout(() => { isFirstLoad.current = false; }, 0);
    })();
  }, []);

  useEffect(() => {
    if (loading || isFirstLoad.current) return;
    storage.set(STORAGE_KEY, JSON.stringify(data));
  }, [data, loading]);

  useEffect(() => {
    if (loading || isFirstLoad.current) return;
    storage.set(NAMES_KEY, JSON.stringify(names));
  }, [names, loading]);

  useEffect(() => {
    if (loading || isFirstLoad.current) return;
    storage.set(PROJECTS_KEY, JSON.stringify(projects));
  }, [projects, loading]);

  useEffect(() => {
    if (loading || isFirstLoad.current) return;
    storage.set(NOTES_KEY, JSON.stringify(notes));
  }, [notes, loading]);

  useEffect(() => {
    if (loading || isFirstLoad.current) return;
    storage.set(INSPIRATION_KEY, JSON.stringify(inspirationLinks));
  }, [inspirationLinks, loading]);

  useEffect(() => {
    if (loading || isFirstLoad.current) return;
    storage.set(DISCUSSION_KEY, JSON.stringify(discussionQueue));
  }, [discussionQueue, loading]);

  function tasksFor(d, track) {
    return (data[d] && data[d][track]) || [];
  }

  function addTask(track, text, projectId) {
    if (!text.trim()) return;
    setData(prev => {
      const day = { ...(prev[date] || {}) };
      const list = day[track] ? [...day[track]] : [];
      list.push({ id: uid(), text: text.trim(), done: false, status: 'active', projectId: projectId || null });
      day[track] = list;
      return { ...prev, [date]: day };
    });
    setNewTask('');
  }

  function toggleTask(track, id) {
    setData(prev => {
      const day = { ...(prev[date] || {}) };
      const list = (day[track] || []).map(t => t.id === id ? { ...t, done: !t.done } : t);
      day[track] = list;
      return { ...prev, [date]: day };
    });
  }

  function setTaskStatus(track, id, status) {
    setData(prev => {
      const day = { ...(prev[date] || {}) };
      const list = (day[track] || []).map(t => t.id === id ? { ...t, status } : t);
      day[track] = list;
      return { ...prev, [date]: day };
    });
  }

  function deleteTask(track, id) {
    setData(prev => {
      const day = { ...(prev[date] || {}) };
      const list = (day[track] || []).filter(t => t.id !== id);
      day[track] = list;
      return { ...prev, [date]: day };
    });
  }

  function shiftDate(delta) {
    const d = new Date(date + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    setDate(d.toISOString().split('T')[0]);
  }

  function startListening(track) {
    if (!speechSupported) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setNewTask(prev => (prev ? prev + ' ' : '') + transcript);
    };
    rec.onerror = () => setListening(null);
    rec.onend = () => setListening(null);
    recognitionRef.current = rec;
    setListening(track);
    rec.start();
  }

  function stopListening() {
    if (recognitionRef.current) recognitionRef.current.stop();
    setListening(null);
  }

  function addProject(name) {
    if (!name.trim()) return;
    setProjects(prev => [...prev, { id: uid(), name: name.trim(), status: 'planning', notes: '' }]);
  }

  function updateProjectStatus(id, status) {
    setProjects(prev => prev.map(p => p.id === id ? { ...p, status } : p));
  }

  function updateProjectNotes(id, notes) {
    setProjects(prev => prev.map(p => p.id === id ? { ...p, notes } : p));
  }

  function deleteProject(id) {
    setProjects(prev => prev.filter(p => p.id !== id));
    if (activeProjectId === id) setActiveProjectId(null);
  }

  function getDailyNote(d) {
    return (notes[d] && notes[d].daily) || '';
  }

  function setDailyNote(d, text) {
    setNotes(prev => {
      const day = Object.assign({}, prev[d]);
      day.daily = text;
      const next = Object.assign({}, prev);
      next[d] = day;
      return next;
    });
  }

  function getTrackNote(d, track) {
    return (notes[d] && notes[d].tracks && notes[d].tracks[track]) || '';
  }

  function setTrackNote(d, track, text) {
    setNotes(prev => {
      const day = Object.assign({}, prev[d]);
      const tracksObj = Object.assign({}, day.tracks);
      tracksObj[track] = text;
      day.tracks = tracksObj;
      const next = Object.assign({}, prev);
      next[d] = day;
      return next;
    });
  }

  function getScheduleSlot(d, slotId) {
    return (notes[d] && notes[d].schedule && notes[d].schedule[slotId]) || { projectId: '', text: '' };
  }

  function setScheduleSlot(d, slotId, val) {
    setNotes(prev => {
      const day = Object.assign({}, prev[d]);
      const sched = Object.assign({}, day.schedule);
      sched[slotId] = val;
      day.schedule = sched;
      const next = Object.assign({}, prev);
      next[d] = day;
      return next;
    });
  }

  function getDevotion(d, track) {
    return (notes[d] && notes[d].devotions && notes[d].devotions[track]) || { done: false, note: '' };
  }
  function setDevotion(d, track, val) {
    setNotes(prev => {
      const day = Object.assign({}, prev[d]);
      const devObj = Object.assign({}, day.devotions);
      devObj[track] = val;
      day.devotions = devObj;
      const next = Object.assign({}, prev);
      next[d] = day;
      return next;
    });
  }
  function getLunch(d, track) {
    return (notes[d] && notes[d].lunch && notes[d].lunch[track]) || '';
  }
  function setLunch(d, track, time) {
    setNotes(prev => {
      const day = Object.assign({}, prev[d]);
      const lunchObj = Object.assign({}, day.lunch);
      lunchObj[track] = time;
      day.lunch = lunchObj;
      const next = Object.assign({}, prev);
      next[d] = day;
      return next;
    });
  }

  function addInspirationLink(text) {
    if (!text.trim()) return;
    setInspirationLinks(prev => [{ id: uid(), text: text.trim(), addedAt: new Date().toISOString().split('T')[0] }, ...prev]);
    setNewInspiration('');
  }

  function deleteInspirationLink(id) {
    setInspirationLinks(prev => prev.filter(l => l.id !== id));
  }

  function discussionItemsFor(track) {
    return discussionQueue[track] || [];
  }

  function addDiscussionItem(track, text, tag) {
    if (!text.trim()) return;
    const now = new Date();
    const stamp = now.toLocaleDateString(undefined, { month: '2-digit', day: '2-digit' }) + ' · ' + now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    setDiscussionQueue(prev => {
      const list = prev[track] ? [...prev[track]] : [];
      list.unshift({ id: uid(), text: text.trim(), tag, stamp, resolved: false });
      return { ...prev, [track]: list };
    });
  }

  function toggleDiscussionItem(track, id) {
    setDiscussionQueue(prev => {
      const list = (prev[track] || []).map(i => i.id === id ? { ...i, resolved: !i.resolved } : i);
      return { ...prev, [track]: list };
    });
  }

  function deleteDiscussionItem(track, id) {
    setDiscussionQueue(prev => {
      const list = (prev[track] || []).filter(i => i.id !== id);
      return { ...prev, [track]: list };
    });
  }

  function exportBackup() {
    const backup = {
      exportedAt: new Date().toISOString(),
      data: data,
      names: names,
      projects: projects,
      notes: notes,
      inspirationLinks: inspirationLinks,
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'jal-backup-' + new Date().toISOString().split('T')[0] + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const today = dayName(date);
  const oneOnOneToday = today === 'Wednesday' ? 'editor1' : today === 'Thursday' ? 'editor2' : null;

  if (loading) {
    return <div style={{ padding: 40, color: '#a8a092', fontSize: 14 }}>Loading…</div>;
  }

  return (
    <div style={{ maxWidth: 720, margin: '0 auto', padding: '20px 16px 60px' }}>
      <Header view={view} setView={setView} />

      {view === 'daily' && (
        <DailyView
          date={date}
          shiftDate={shiftDate}
          today={today}
          oneOnOneToday={oneOnOneToday}
          names={names}
          activeTrack={activeTrack}
          setActiveTrack={setActiveTrack}
          tasksFor={tasksFor}
          newTask={newTask}
          setNewTask={setNewTask}
          addTask={addTask}
          toggleTask={toggleTask}
          deleteTask={deleteTask}
          setTaskStatus={setTaskStatus}
          listening={listening}
          startListening={startListening}
          stopListening={stopListening}
          speechSupported={speechSupported}
          projects={projects}
          editingName={editingName}
          setEditingName={setEditingName}
          setNames={setNames}
          getDailyNote={getDailyNote}
          setDailyNote={setDailyNote}
          getTrackNote={getTrackNote}
          setTrackNote={setTrackNote}
          getScheduleSlot={getScheduleSlot}
          setScheduleSlot={setScheduleSlot}
          getDevotion={getDevotion}
          setDevotion={setDevotion}
          getLunch={getLunch}
          setLunch={setLunch}
          inspirationLinks={inspirationLinks}
          newInspiration={newInspiration}
          setNewInspiration={setNewInspiration}
          addInspirationLink={addInspirationLink}
          deleteInspirationLink={deleteInspirationLink}
          discussionItemsFor={discussionItemsFor}
          addDiscussionItem={addDiscussionItem}
          toggleDiscussionItem={toggleDiscussionItem}
          deleteDiscussionItem={deleteDiscussionItem}
          exportBackup={exportBackup}
        />
      )}

      {view === 'prep' && (
        <PrepView names={names} />
      )}

      {view === 'projects' && (
        <ProjectsView
          projects={projects}
          addProject={addProject}
          updateProjectStatus={updateProjectStatus}
          updateProjectNotes={updateProjectNotes}
          deleteProject={deleteProject}
          activeProjectId={activeProjectId}
          setActiveProjectId={setActiveProjectId}
        />
      )}
    </div>
  );
}

function Header({ view, setView }) {
  const tabs = [
    { id: 'daily', label: 'Daily' },
    { id: 'prep', label: 'Cheat Sheet' },
    { id: 'projects', label: 'Projects' },
  ];
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 13, letterSpacing: '0.12em', color: '#5a554c', marginBottom: 12, textTransform: 'uppercase' }}>JAL</div>
      <div style={{ display: 'flex', gap: 8 }}>
        {tabs.map(t => (
          <button
            key={t.id}
            onClick={() => setView(t.id)}
            style={{
              ...navBtn,
              flex: 1,
              padding: '10px 8px',
              fontSize: 13,
              borderColor: view === t.id ? '#7a9b8e' : '#2a2722',
              color: view === t.id ? '#e8e3da' : '#a8a092',
              background: view === t.id ? '#232826' : 'transparent',
            }}
          >
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function DailyView(props) {
  const {
    date, shiftDate, today, oneOnOneToday, names,
    activeTrack, setActiveTrack, tasksFor,
    newTask, setNewTask, addTask, toggleTask, deleteTask, setTaskStatus,
    listening, startListening, stopListening, speechSupported,
    projects, editingName, setEditingName, setNames,
    getDailyNote, setDailyNote, getTrackNote, setTrackNote,
    getScheduleSlot, setScheduleSlot,
    getDevotion, setDevotion, getLunch, setLunch,
    inspirationLinks, newInspiration, setNewInspiration, addInspirationLink, deleteInspirationLink,
    discussionItemsFor, addDiscussionItem, toggleDiscussionItem, deleteDiscussionItem,
    exportBackup,
  } = props;
  const [showSchedule, setShowSchedule] = useState(false);

  const trackLabel = (id) => {
    if (id === 'editor1') return names.editor1;
    if (id === 'editor2') return names.editor2;
    return TRACKS.find(t => t.id === id)?.label || id;
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
        <button style={navBtn} onClick={() => shiftDate(-1)}>‹</button>
        <div style={{ flex: 1, textAlign: 'center' }}>
          <div style={{ fontSize: 15, fontWeight: 600 }}>{today}</div>
          <div style={{ fontSize: 12, color: '#5a554c' }}>{date}</div>
        </div>
        <button style={navBtn} onClick={() => shiftDate(1)}>›</button>
      </div>

      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 16 }}>
        <button
          onClick={exportBackup}
          style={{ background: 'none', border: 'none', color: '#5a554c', fontSize: 11, cursor: 'pointer', padding: 0, textDecoration: 'underline' }}
        >
          Export backup
        </button>
      </div>

      {oneOnOneToday && (
        <div style={{
          background: '#232826', border: '1px solid #3a4a44', borderRadius: 6,
          padding: '10px 12px', marginBottom: 16, fontSize: 13, color: '#9bb8ab',
        }}>
          1:1 with {trackLabel(oneOnOneToday)} today — check the Cheat Sheet tab to prep.
        </div>
      )}

      <div style={{ marginBottom: 16, padding: 12, background: '#1f1d1a', border: '1px solid #2a2722', borderRadius: 6 }}>
        <div style={{ fontSize: 11, color: '#5a554c', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          Inspiration: links, videos, creative thoughts
        </div>
        <div style={{ display: 'flex', gap: 8, marginBottom: inspirationLinks.length ? 10 : 0 }}>
          <input
            value={newInspiration}
            onChange={(e) => setNewInspiration(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') addInspirationLink(newInspiration); }}
            placeholder="Paste a link or jot a thought…"
            style={{ flex: 1, fontSize: 13 }}
          />
          <button style={{ ...navBtn, color: '#7a9b8e', borderColor: '#7a9b8e' }} onClick={() => addInspirationLink(newInspiration)}>+</button>
        </div>
        {inspirationLinks.length > 0 && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 180, overflowY: 'auto' }}>
            {inspirationLinks.map(link => (
              <div key={link.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, fontSize: 12.5 }}>
                <span style={{ color: '#5a554c', fontSize: 10, marginTop: 2, flexShrink: 0 }}>{link.addedAt}</span>
                <span style={{ flex: 1, color: '#c9c3b6', wordBreak: 'break-word' }}>{link.text}</span>
                <button onClick={() => deleteInspirationLink(link.id)} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 14, padding: 0, lineHeight: 1, flexShrink: 0 }}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 11, color: '#5a554c', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Daily notes</div>
        <textarea
          value={getDailyNote(date)}
          onChange={(e) => setDailyNote(date, e.target.value)}
          placeholder="Anything on your mind for today..."
          style={{ width: '100%', minHeight: 70, resize: 'vertical' }}
        />
      </div>

      <div style={{ marginBottom: 16 }}>
        <button
          onClick={() => setShowSchedule(!showSchedule)}
          style={{ ...navBtn, width: '100%', justifyContent: 'space-between', padding: '10px 12px', fontSize: 13, color: '#a8a092' }}
        >
          <span>Hourly schedule</span>
          <span>{showSchedule ? '−' : '+'}</span>
        </button>
        {showSchedule && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 8 }}>
            {SCHEDULE_SLOTS.map(slot => {
              const slotData = getScheduleSlot(date, slot.id);
              return (
                <div key={slot.id} style={{ display: 'flex', flexDirection: 'column', gap: 4, paddingBottom: 6, borderBottom: '1px solid #232020' }}>
                  <div style={{ fontSize: 11, color: '#5a554c' }}>{slot.label}</div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <select
                      value={slotData.projectId || ''}
                      onChange={(e) => setScheduleSlot(date, slot.id, { ...slotData, projectId: e.target.value })}
                      style={{ flex: 1, fontSize: 12, padding: '6px 8px', minWidth: 0 }}
                    >
                      <option value="">No project</option>
                      {projects.map(p => (
                        <option key={p.id} value={p.id}>{p.name}</option>
                      ))}
                    </select>
                    <input
                      value={slotData.text || ''}
                      onChange={(e) => setScheduleSlot(date, slot.id, { ...slotData, text: e.target.value })}
                      placeholder="Notes…"
                      style={{ flex: 1, fontSize: 12, padding: '6px 8px', minWidth: 0 }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ display: 'flex', gap: 6, marginBottom: 16, overflowX: 'auto', paddingBottom: 4 }}>
        {TRACKS.map(t => {
          const isEditingThis = editingName === t.id && (t.id === 'editor1' || t.id === 'editor2');
          return (
            <button
              key={t.id}
              onClick={() => setActiveTrack(t.id)}
              style={{
                ...navBtn,
                whiteSpace: 'nowrap',
                fontSize: 13,
                borderColor: activeTrack === t.id ? t.color : '#2a2722',
                color: activeTrack === t.id ? '#e8e3da' : '#a8a092',
                background: activeTrack === t.id ? '#232826' : 'transparent',
              }}
            >
              {trackLabel(t.id)}
            </button>
          );
        })}
      </div>

      {(activeTrack === 'editor1' || activeTrack === 'editor2') && (
        <div style={{ marginBottom: 12 }}>
          {editingName === activeTrack ? (
            <input
              autoFocus
              defaultValue={names[activeTrack]}
              onBlur={(e) => { setNames(prev => ({ ...prev, [activeTrack]: e.target.value || prev[activeTrack] })); setEditingName(null); }}
              onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
              style={{ fontSize: 13, padding: '4px 8px' }}
            />
          ) : (
            <button
              onClick={() => setEditingName(activeTrack)}
              style={{ background: 'none', border: 'none', color: '#5a554c', fontSize: 12, cursor: 'pointer', padding: 0 }}
            >
              rename {trackLabel(activeTrack)} ✎
            </button>
          )}
        </div>
      )}

      {(activeTrack === 'editor1' || activeTrack === 'editor2') && (() => {
        const dev = getDevotion(date, activeTrack);
        const lunchTime = getLunch(date, activeTrack);
        return (
          <div style={{ marginBottom: 16, padding: '8px 10px', background: '#1f1d1a', borderRadius: 6, border: '1px solid #232020' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <button
                onClick={() => setDevotion(date, activeTrack, { ...dev, done: !dev.done })}
                style={{
                  width: 14, height: 14, minWidth: 14, borderRadius: 3,
                  border: `1px solid ${dev.done ? '#5a7a6c' : '#3a362f'}`,
                  background: dev.done ? '#5a7a6c' : 'transparent',
                  cursor: 'pointer', padding: 0,
                }}
              />
              <span style={{ fontSize: 11, color: '#5a554c' }}>Devotions</span>
              <input
                value={dev.note || ''}
                onChange={(e) => setDevotion(date, activeTrack, { ...dev, note: e.target.value })}
                placeholder="note (optional)"
                style={{ flex: 1, fontSize: 11, padding: '3px 6px', background: 'transparent', border: 'none', color: '#8a8478' }}
              />
              <span style={{ fontSize: 11, color: '#5a554c', marginLeft: 6 }}>Lunch</span>
              <input
                value={lunchTime}
                onChange={(e) => setLunch(date, activeTrack, e.target.value)}
                placeholder="time"
                style={{ width: 64, fontSize: 11, padding: '3px 6px', background: 'transparent', border: 'none', color: '#8a8478' }}
              />
            </div>
          </div>
        );
      })()}

      {(activeTrack === 'editor1' || activeTrack === 'editor2') && (
        <DiscussionQueue
          trackLabel={trackLabel(activeTrack)}
          items={discussionItemsFor(activeTrack)}
          onAdd={(text, tag) => addDiscussionItem(activeTrack, text, tag)}
          onToggle={(id) => toggleDiscussionItem(activeTrack, id)}
          onDelete={(id) => deleteDiscussionItem(activeTrack, id)}
        />
      )}

      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 11, color: '#5a554c', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          Notes for {trackLabel(activeTrack)}
        </div>
        <textarea
          value={getTrackNote(date, activeTrack)}
          onChange={(e) => setTrackNote(date, activeTrack, e.target.value)}
          placeholder={`Notes for ${trackLabel(activeTrack)} today...`}
          style={{ width: '100%', minHeight: 70, resize: 'vertical' }}
        />
      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input
          value={newTask}
          onChange={(e) => setNewTask(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') addTask(activeTrack, newTask); }}
          placeholder={`Add a task for ${trackLabel(activeTrack)}…`}
          style={{ flex: 1 }}
        />
        {speechSupported && (
          <button
            style={{ ...navBtn, color: listening === activeTrack ? '#c4956c' : '#a8a092', borderColor: listening === activeTrack ? '#c4956c' : '#2a2722' }}
            onClick={() => listening === activeTrack ? stopListening() : startListening(activeTrack)}
          >
            {listening === activeTrack ? '●' : '🎤'}
          </button>
        )}
        <button style={{ ...navBtn, color: '#7a9b8e', borderColor: '#7a9b8e' }} onClick={() => addTask(activeTrack, newTask)}>+</button>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {tasksFor(date, activeTrack).length === 0 && (
          <div style={{ color: '#5a554c', fontSize: 13, padding: '20px 0', textAlign: 'center' }}>
            Nothing here yet for {trackLabel(activeTrack)} on this day.
          </div>
        )}
        {tasksFor(date, activeTrack).map(task => (
          <TaskRow
            key={task.id}
            task={task}
            onToggle={() => toggleTask(activeTrack, task.id)}
            onDelete={() => deleteTask(activeTrack, task.id)}
            onStatus={(s) => setTaskStatus(activeTrack, task.id, s)}
            project={projects.find(p => p.id === task.projectId)}
          />
        ))}
      </div>

      <div style={{ marginTop: 28, paddingTop: 16, borderTop: '1px solid #2a2722' }}>
        <div style={{ fontSize: 11, color: '#5a554c', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          For inspiration
        </div>
        {(() => {
          const q = pickDailyQuote(date);
          return (
            <div>
              <div style={{ fontSize: 14, color: '#c9c3b6', fontStyle: 'italic', lineHeight: 1.5 }}>"{q.text}"</div>
              <div style={{ fontSize: 12, color: '#5a554c', marginTop: 6 }}>— {q.author}</div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

function TaskRow({ task, onToggle, onDelete, onStatus }) {
  const [showStatus, setShowStatus] = useState(false);
  const statusInfo = STATUSES.find(s => s.id === task.status) || STATUSES[0];
  return (
    <div style={{ border: '1px solid #2a2722', borderRadius: 6, padding: '10px 12px', background: '#1f1d1a' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
        <button
          onClick={onToggle}
          style={{
            width: 18, height: 18, minWidth: 18, borderRadius: 4, marginTop: 2,
            border: `1.5px solid ${task.done ? '#5a7a6c' : '#5a554c'}`,
            background: task.done ? '#5a7a6c' : 'transparent',
            cursor: 'pointer', padding: 0,
          }}
        >
          {task.done && <span style={{ color: '#1a1816', fontSize: 12 }}>✓</span>}
        </button>
        <div style={{ flex: 1, fontSize: 14, color: task.done ? '#5a554c' : '#e8e3da', textDecoration: task.done ? 'line-through' : 'none' }}>
          {task.text}
        </div>
        <button onClick={onDelete} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 16, padding: 0, lineHeight: 1 }}>×</button>
      </div>
      <div style={{ marginTop: 8, marginLeft: 28, position: 'relative' }}>
        <button
          onClick={() => setShowStatus(!showStatus)}
          style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 11, color: statusInfo.color, display: 'flex', alignItems: 'center', gap: 5, padding: 0 }}
        >
          <span style={{ width: 7, height: 7, borderRadius: '50%', background: statusInfo.color, display: 'inline-block' }}></span>
          {statusInfo.label}
        </button>
        {showStatus && (
          <div style={{ position: 'absolute', top: 18, left: 0, background: '#232020', border: '1px solid #2a2722', borderRadius: 6, padding: 6, zIndex: 10, display: 'flex', flexDirection: 'column', gap: 4 }}>
            {STATUSES.map(s => (
              <button
                key={s.id}
                onClick={() => { onStatus(s.id); setShowStatus(false); }}
                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 12, color: s.color, textAlign: 'left', padding: '4px 8px', whiteSpace: 'nowrap' }}
              >
                ● {s.label}
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function DiscussionQueue({ trackLabel, items, onAdd, onToggle, onDelete }) {
  const [draft, setDraft] = useState('');
  const [tag, setTag] = useState('skill');
  const [showResolved, setShowResolved] = useState(false);

  const active = items.filter(i => !i.resolved);
  const resolved = items.filter(i => i.resolved);

  function handleAdd() {
    if (!draft.trim()) return;
    onAdd(draft, tag);
    setDraft('');
  }

  return (
    <div style={{ marginBottom: 16, padding: 12, background: '#1f1d1a', border: '1px solid #2a2722', borderRadius: 6 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 8 }}>
        <div style={{ fontSize: 11, color: '#5a554c', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
          To discuss with {trackLabel}
        </div>
        {active.length > 0 && (
          <div style={{ fontSize: 11, color: '#5a554c' }}>{active.length} pending</div>
        )}
      </div>

      <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
        <input
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') handleAdd(); }}
          placeholder="What do you want to bring up…"
          style={{ flex: 1, fontSize: 13 }}
        />
        <button style={{ ...navBtn, color: '#7a9b8e', borderColor: '#7a9b8e' }} onClick={handleAdd}>+</button>
      </div>

      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: (active.length || resolved.length) ? 10 : 0 }}>
        {DISCUSSION_TAGS.map(t => (
          <button
            key={t.id}
            onClick={() => setTag(t.id)}
            style={{
              background: 'none',
              border: `1px solid ${tag === t.id ? t.color : '#2a2722'}`,
              borderRadius: 10,
              padding: '3px 9px',
              fontSize: 11,
              color: tag === t.id ? t.color : '#5a554c',
              cursor: 'pointer',
            }}
          >
            {t.label}
          </button>
        ))}
      </div>

      {active.length === 0 && resolved.length === 0 && (
        <div style={{ color: '#5a554c', fontSize: 12.5, padding: '6px 0', textAlign: 'center' }}>
          Nothing queued.
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
        {active.map(item => {
          const tagInfo = DISCUSSION_TAGS.find(t => t.id === item.tag) || DISCUSSION_TAGS[3];
          return (
            <div key={item.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 8, padding: '6px 0' }}>
              <button
                onClick={() => onToggle(item.id)}
                style={{
                  width: 14, height: 14, minWidth: 14, borderRadius: 3, marginTop: 2,
                  border: '1px solid #3a362f', background: 'transparent', cursor: 'pointer', padding: 0,
                }}
              />
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
                  <span style={{ fontSize: 10, color: tagInfo.color }}>{tagInfo.label}</span>
                  <span style={{ fontSize: 10, color: '#5a554c' }}>{item.stamp}</span>
                </div>
                <div style={{ fontSize: 13, color: '#e8e3da', lineHeight: 1.4 }}>{item.text}</div>
              </div>
              <button onClick={() => onDelete(item.id)} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 14, padding: 0, lineHeight: 1 }}>×</button>
            </div>
          );
        })}
      </div>

      {resolved.length > 0 && (
        <div style={{ marginTop: 8, paddingTop: 8, borderTop: '1px solid #232020' }}>
          <button
            onClick={() => setShowResolved(!showResolved)}
            style={{ background: 'none', border: 'none', color: '#5a554c', fontSize: 11, cursor: 'pointer', padding: 0 }}
          >
            Discussed ({resolved.length}) {showResolved ? '−' : '+'}
          </button>
          {showResolved && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginTop: 8 }}>
              {resolved.map(item => (
                <div key={item.id} style={{ display: 'flex', alignItems: 'center', gap: 8, opacity: 0.55 }}>
                  <span style={{ fontSize: 10, color: '#5a554c', minWidth: 50 }}>{item.stamp}</span>
                  <span style={{ flex: 1, fontSize: 12.5, color: '#8a8478', textDecoration: 'line-through' }}>{item.text}</span>
                  <button onClick={() => onToggle(item.id)} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 11, padding: 0 }}>↺</button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PrepView({ names }) {
  const sheets = [
    { ...CHEAT_SHEET.editor1, name: names.editor1, day: 'Wednesday' },
    { ...CHEAT_SHEET.editor2, name: names.editor2, day: 'Thursday' },
  ];
  return (
    <div>
      <div style={{ fontSize: 13, color: '#5a554c', marginBottom: 16 }}>
        Weekly 1:1 cheat sheet — glance before each conversation.
      </div>
      {sheets.map((sheet, idx) => (
        <div key={idx} style={{ marginBottom: 28 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>{sheet.name}</div>
            <div style={{ fontSize: 12, color: '#5a554c' }}>{sheet.day}</div>
          </div>
          <div style={{ fontSize: 12, color: '#8a8478', marginBottom: 10, fontStyle: 'italic' }}>{sheet.subtitle}</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {sheet.items.map(item => (
              <div key={item.id} style={{ border: '1px solid #2a2722', borderRadius: 6, padding: '10px 12px', background: '#1f1d1a', borderLeft: `3px solid ${KIND_COLORS[item.kind]}` }}>
                <div style={{ fontSize: 13.5 }}>{item.q}</div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function ProjectsView({ projects, addProject, updateProjectStatus, updateProjectNotes, deleteProject, activeProjectId, setActiveProjectId }) {
  const [newProject, setNewProject] = useState('');
  const active = projects.find(p => p.id === activeProjectId);

  if (active) {
    const statusInfo = STATUSES.find(s => s.id === active.status) || STATUSES[0];
    return (
      <div>
        <button onClick={() => setActiveProjectId(null)} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 13, marginBottom: 16, padding: 0 }}>← back to projects</button>
        <div style={{ fontSize: 18, fontWeight: 600, marginBottom: 8 }}>{active.name}</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 16 }}>
          {STATUSES.map(s => (
            <button
              key={s.id}
              onClick={() => updateProjectStatus(active.id, s.id)}
              style={{
                ...navBtn, fontSize: 12, padding: '6px 10px',
                borderColor: active.status === s.id ? s.color : '#2a2722',
                color: active.status === s.id ? s.color : '#a8a092',
              }}
            >
              {s.label}
            </button>
          ))}
        </div>
        <textarea
          value={active.notes}
          onChange={(e) => updateProjectNotes(active.id, e.target.value)}
          placeholder="Notes…"
          style={{ width: '100%', minHeight: 160, resize: 'vertical' }}
        />
        <button
          onClick={() => deleteProject(active.id)}
          style={{ ...navBtn, color: '#c4956c', borderColor: '#c4956c', marginTop: 16, width: '100%' }}
        >
          Delete project
        </button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input
          value={newProject}
          onChange={(e) => setNewProject(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') { addProject(newProject); setNewProject(''); } }}
          placeholder="New project name…"
          style={{ flex: 1 }}
        />
        <button
          style={{ ...navBtn, color: '#7a9b8e', borderColor: '#7a9b8e' }}
          onClick={() => { addProject(newProject); setNewProject(''); }}
        >
          +
        </button>
      </div>
      {projects.length === 0 && (
        <div style={{ color: '#5a554c', fontSize: 13, padding: '20px 0', textAlign: 'center' }}>No projects yet.</div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {projects.map(p => {
          const statusInfo = STATUSES.find(s => s.id === p.status) || STATUSES[0];
          return (
            <button
              key={p.id}
              onClick={() => setActiveProjectId(p.id)}
              style={{
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                border: '1px solid #2a2722', borderRadius: 6, padding: '12px 14px',
                background: '#1f1d1a', cursor: 'pointer', textAlign: 'left', color: '#e8e3da',
              }}
            >
              <span style={{ fontSize: 14 }}>{p.name}</span>
              <span style={{ fontSize: 11, color: statusInfo.color, display: 'flex', alignItems: 'center', gap: 5 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: statusInfo.color, display: 'inline-block' }}></span>
                {statusInfo.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
