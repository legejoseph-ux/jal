<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>JAL</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1a1816; color: #e8e3da; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; background: #232020; color: #e8e3da; border: 1px solid #2a2722; border-radius: 6px; padding: 8px 10px; }
  input:focus, textarea:focus { outline: 1px solid #7a9b8e; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #2a2722; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw === null ? null : { key, value: raw };
    } catch (err) {
      console.error('storage.get failed:', err);
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return { key, value };
    } catch (err) {
      console.error('storage.set failed:', err);
      return null;
    }
  }
};

const CHEAT_SHEET = {
  editor1: {
    title: 'For Jordan',
    subtitle: 'Anchor mode; growth & calibration',
    items: [
      { id: 's1', q: 'What are you most proud of from this week?', kind: 'growth' },
      { id: 's2', q: 'Where are you growing bored or under-challenged?', kind: 'growth' },
      { id: 's3', q: 'Anything happening on the team I should know about that I might be missing?', kind: 'work' },
      { id: 's4', q: 'How is the workload, sustainable or starting to fray?', kind: 'wellbeing' },
      { id: 's5', q: 'What would make next week feel like a great week?', kind: 'wellbeing' },
    ],
  },
  editor2: {
    title: 'For Dakota',
    subtitle: 'Coach mode; specific & developmental',
    items: [
      { id: 'a1', q: 'What is one technical skill you want to be stronger in by next month?', kind: 'growth' },
      { id: 'a2', q: 'What feedback from the past week is sitting with you?', kind: 'growth' },
      { id: 'a3', q: 'When did you feel most confident? Least confident?', kind: 'wellbeing' },
      { id: 'a4', q: 'Walk me through one decision you made this week and your reasoning.', kind: 'growth' },
      { id: 'a5', q: 'What is a habit you are trying to build right now, at work or outside?', kind: 'wellbeing' },
    ],
  },
};

const KIND_COLORS = { work: '#7a9b8e', growth: '#d4a574', wellbeing: '#c4956c' };
const STORAGE_KEY = 'jal-data-v2';
const NAMES_KEY = 'jal-names-v2';
const PROJECTS_KEY = 'jal-projects-v2';
const STATUSES = [
  { id: 'active', label: 'Active', color: '#7a9b8e' },
  { id: 'planning', label: 'Planning', color: '#8a9bc4' },
  { id: 'paused', label: 'Paused', color: '#c4956c' },
  { id: 'review', label: 'In Review', color: '#d4a574' },
  { id: 'done', label: 'Complete', color: '#5a7a6c' },
];

const navBtn = { background: 'transparent', border: '1px solid #2a2722', borderRadius: '2px', padding: '8px 10px', color: '#a8a092', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' };

const TRACKS = [
  { id: 'self', label: 'Yours', color: '#a8a092' },
  { id: 'editor1', label: 'Jordan', color: '#7a9b8e' },
  { id: 'editor2', label: 'Dakota', color: '#c4956c' },
  { id: 'pastoral', label: 'Pastoral', color: '#d4a574' },
  { id: 'prep', label: '1:1 Prep', color: '#8a9bc4' },
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function dayName(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
}function App() {
  const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
  const [data, setData] = useState({});
  const [names, setNames] = useState({ editor1: 'Jordan', editor2: 'Dakota' });
  const [activeTrack, setActiveTrack] = useState('self');
  const [newTask, setNewTask] = useState('');
  const [loading, setLoading] = useState(true);
  const [editingName, setEditingName] = useState(null);
  const [listening, setListening] = useState(null);
  const [projects, setProjects] = useState([]);
  const [view, setView] = useState('daily');
  const [activeProjectId, setActiveProjectId] = useState(null);
  const recognitionRef = useRef(null);
  const speechSupported = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);

  useEffect(() => {
    (async () => {
      try {
        const s = await storage.get(STORAGE_KEY);
        if (s && s.value) setData(JSON.parse(s.value));
      } catch (err) {
        console.error('Failed to load task data:', err);
      }
      try {
        const n = await storage.get(NAMES_KEY);
        if (n && n.value) setNames(JSON.parse(n.value));
      } catch (err) {
        console.error('Failed to load names:', err);
      }
      try {
        const p = await storage.get(PROJECTS_KEY);
        if (p && p.value) setProjects(JSON.parse(p.value));
      } catch (err) {
        console.error('Failed to load projects:', err);
      }
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (loading) return;
    storage.set(STORAGE_KEY, JSON.stringify(data));
  }, [data, loading]);

  useEffect(() => {
    if (loading) return;
    storage.set(NAMES_KEY, JSON.stringify(names));
  }, [names, loading]);

  useEffect(() => {
    if (loading) return;
    storage.set(PROJECTS_KEY, JSON.stringify(projects));
  }, [projects, loading]);

  function tasksFor(d, track) {
    return (data[d] && data[d][track]) || [];
  }

  function addTask(track, text, projectId) {
    if (!text.trim()) return;
    setData(prev => {
      const day = Object.assign({}, prev[date]);
      const list = day[track] ? day[track].slice() : [];
      list.push({ id: uid(), text: text.trim(), done: false, status: 'active', projectId: projectId || null });
      day[track] = list;
      const next = Object.assign({}, prev);
      next[date] = day;
      return next;
    });
    setNewTask('');
  }

  function toggleTask(track, id) {
    setData(prev => {
      const day = Object.assign({}, prev[date]);
      const list = (day[track] || []).map(t => t.id === id ? Object.assign({}, t, { done: !t.done }) : t);
      day[track] = list;
      const next = Object.assign({}, prev);
      next[date] = day;
      return next;
    });
  }

  function setTaskStatus(track, id, status) {
    setData(prev => {
      const day = Object.assign({}, prev[date]);
      const list = (day[track] || []).map(t => t.id === id ? Object.assign({}, t, { status: status }) : t);
      day[track] = list;
      const next = Object.assign({}, prev);
      next[date] = day;
      return next;
    });
  }

  function deleteTask(track, id) {
    setData(prev => {
      const day = Object.assign({}, prev[date]);
      const list = (day[track] || []).filter(t => t.id !== id);
      day[track] = list;
      const next = Object.assign({}, prev);
      next[date] = day;
      return next;
    });
  }

  function shiftDate(delta) {
    const d = new Date(date + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    setDate(d.toISOString().split('T')[0]);
  }

  function startListening(track) {
    if (!speechSupported) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = function(e) {
      const transcript = e.results[0][0].transcript;
      setNewTask(prev => (prev ? prev + ' ' : '') + transcript);
    };
    rec.onerror = function() { setListening(null); };
    rec.onend = function() { setListening(null); };
    recognitionRef.current = rec;
    setListening(track);
    rec.start();
  }

  function stopListening() {
    if (recognitionRef.current) recognitionRef.current.stop();
    setListening(null);
  }

  function addProject(name) {
    if (!name.trim()) return;
    setProjects(prev => prev.concat([{ id: uid(), name: name.trim(), status: 'planning', notes: '' }]));
  }

  function updateProjectStatus(id, status) {
    setProjects(prev => prev.map(p => p.id === id ? Object.assign({}, p, { status: status }) : p));
  }

  function updateProjectNotes(id, notes) {
    setProjects(prev => prev.map(p => p.id === id ? Object.assign({}, p, { notes: notes }) : p));
  }

  function deleteProject(id) {
    setProjects(prev => prev.filter(p => p.id !== id));
    if (activeProjectId === id) setActiveProjectId(null);
  }

  const today = dayName(date);
  const oneOnOneToday = today === 'Wednesday' ? 'editor1' : (today === 'Thursday' ? 'editor2' : null);

  if (loading) {
    return <div style={{ padding: 40, color: '#a8a092', fontSize: 14 }}>Loading...</div>;
  }return (
    <div style={{ maxWidth: 720, margin: '0 auto', padding: '20px 16px 60px' }}>
      <Header view={view} setView={setView} />

      {view === 'daily' && (
        <DailyView
          date={date}
          shiftDate={shiftDate}
          today={today}
          oneOnOneToday={oneOnOneToday}
          names={names}
          activeTrack={activeTrack}
          setActiveTrack={setActiveTrack}
          tasksFor={tasksFor}
          newTask={newTask}
          setNewTask={setNewTask}
          addTask={addTask}
          toggleTask={toggleTask}
          deleteTask={deleteTask}
          setTaskStatus={setTaskStatus}
          listening={listening}
          startListening={startListening}
          stopListening={stopListening}
          speechSupported={speechSupported}
          projects={projects}
          editingName={editingName}
          setEditingName={setEditingName}
          setNames={setNames}
        />
      )}

      {view === 'prep' && (
        <PrepView names={names} />
      )}

      {view === 'projects' && (
        <ProjectsView
          projects={projects}
          addProject={addProject}
          updateProjectStatus={updateProjectStatus}
          updateProjectNotes={updateProjectNotes}
          deleteProject={deleteProject}
          activeProjectId={activeProjectId}
          setActiveProjectId={setActiveProjectId}
        />
      )}
    </div>
  );
}

function Header(props) {
  const view = props.view;
  const setView = props.setView;
  const tabs = [
    { id: 'daily', label: 'Daily' },
    { id: 'prep', label: 'Cheat Sheet' },
    { id: 'projects', label: 'Projects' },
  ];
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 13, letterSpacing: '0.12em', color: '#5a554c', marginBottom: 12, textTransform: 'uppercase' }}>JAL</div>
      <div style={{ display: 'flex', gap: 8 }}>
        {tabs.map(t => (
          <button
            key={t.id}
            onClick={() => setView(t.id)}
            style={Object.assign({}, navBtn, {
              flex: 1,
              padding: '10px 8px',
              fontSize: 13,
              borderColor: view === t.id ? '#7a9b8e' : '#2a2722',
              color: view === t.id ? '#e8e3da' : '#a8a092',
              background: view === t.id ? '#232826' : 'transparent',
            })}
          >
            {t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function DailyView(props) {
  const date = props.date;
  const shiftDate = props.shiftDate;
  const today = props.today;
  const oneOnOneToday = props.oneOnOneToday;
  const names = props.names;
  const activeTrack = props.activeTrack;
  const setActiveTrack = props.setActiveTrack;
  const tasksFor = props.tasksFor;
  const newTask = props.newTask;
  const setNewTask = props.setNewTask;
  const addTask = props.addTask;
  const toggleTask = props.toggleTask;
  const deleteTask = props.deleteTask;
  const setTaskStatus = props.setTaskStatus;
  const listening = props.listening;
  const startListening = props.startListening;
  const stopListening = props.stopListening;
  const speechSupported = props.speechSupported;
  const projects = props.projects;
  const editingName = props.editingName;
  const setEditingName = props.setEditingName;
  const setNames = props.setNames;

  function trackLabel(id) {
    if (id === 'editor1') return names.editor1;
    if (id === 'editor2') return names.editor2;
    const found = TRACKS.find(t => t.id === id);
    return found ? found.label : id;
  }

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 16 }}>
        <button style={navBtn} onClick={() => shiftDate(-1)}>Prev</button>
        <div style={{ flex: 1, textAlign: 'center' }}>
          <div style={{ fontSize: 15, fontWeight: 600 }}>{today}</div>
          <div style={{ fontSize: 12, color: '#5a554c' }}>{date}</div>
        </div>
        <button style={navBtn} onClick={() => shiftDate(1)}>Next</button>
      </div>

      {oneOnOneToday && (
        <div style={{
          background: '#232826', border: '1px solid #3a4a44', borderRadius: 6,
          padding: '10px 12px', marginBottom: 16, fontSize: 13, color: '#9bb8ab',
        }}>
          1:1 with {trackLabel(oneOnOneToday)} today, check the Cheat Sheet tab to prep.
        </div>
      )}

      <div style={{ display: 'flex', gap: 6, marginBottom: 16, overflowX: 'auto', paddingBottom: 4 }}>
        {TRACKS.map(t => (
          <button
            key={t.id}
            onClick={() => setActiveTrack(t.id)}
            style={Object.assign({}, navBtn, {
              whiteSpace: 'nowrap',
              fontSize: 13,
              borderColor: activeTrack === t.id ? t.color : '#2a2722',
              color: activeTrack === t.id ? '#e8e3da' : '#a8a092',
              background: activeTrack === t.id ? '#232826' : 'transparent',
            })}
          >
            {trackLabel(t.id)}
          </button>
        ))}
      </div>

      {(activeTrack === 'editor1' || activeTrack === 'editor2') && (
        <div style={{ marginBottom: 12 }}>
          {editingName === activeTrack ? (
            <input
              autoFocus
              defaultValue={names[activeTrack]}
              onBlur={(e) => { setNames(prev => { const next = Object.assign({}, prev); next[activeTrack] = e.target.value || prev[activeTrack]; return next; }); setEditingName(null); }}
              onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
              style={{ fontSize: 13, padding: '4px 8px' }}
            />
          ) : (
            <button
              onClick={() => setEditingName(activeTrack)}
              style={{ background: 'none', border: 'none', color: '#5a554c', fontSize: 12, cursor: 'pointer', padding: 0 }}
            >
              rename {trackLabel(activeTrack)}
            </button>
          )}
        </div>
      )}

      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input
          value={newTask}
          onChange={(e) => setNewTask(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') addTask(activeTrack, newTask); }}
          placeholder={'Add a task for ' + trackLabel(activeTrack) + '...'}
          style={{ flex: 1 }}
        />
        {speechSupported && (
          <button
            style={{ ...navBtn, color: listening === activeTrack ? '#c4956c' : '#a8a092', borderColor: listening === activeTrack ? '#c4956c' : '#2a2722' }}
            onClick={() => listening === activeTrack ? stopListening() : startListening(activeTrack)}
          >
            {listening === activeTrack ? 'Stop' : 'Mic'}
          </button>
        )}
        <button style={{ ...navBtn, color: '#7a9b8e', borderColor: '#7a9b8e' }} onClick={() => addTask(activeTrack, newTask)}>Add</button>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {tasksFor(date, activeTrack).length === 0 && (
          <div style={{ color: '#5a554c', fontSize: 13, padding: '20px 0', textAlign: 'center' }}>
            Nothing here yet for {trackLabel(activeTrack)} on this day.
          </div>
        )}
        {tasksFor(date, activeTrack).map(task => (
          <TaskRow
            key={task.id}
            task={task}
            onToggle={() => toggleTask(activeTrack, task.id)}
            onDelete={() => deleteTask(activeTrack, task.id)}
            onStatus={(s) => setTaskStatus(activeTrack, task.id, s)}
          />
        ))}
      </div>
    </div>
  );
}function TaskRow(props) {
  const task = props.task;
  const onToggle = props.onToggle;
  const onDelete = props.onDelete;
  const onStatus = props.onStatus;
  const [showStatus, setShowStatus] = useState(false);
  const statusInfo = STATUSES.find(s => s.id === task.status) || STATUSES[0];
  return (
    <div style={{ border: '1px solid #2a2722', borderRadius: 6, padding: '10px 12px', background: '#1f1d1a' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
        <button
          onClick={onToggle}
          style={{
            width: 18, height: 18, minWidth: 18, borderRadius: 4, marginTop: 2,
            border: '1.5px solid ' + (task.done ? '#5a7a6c' : '#5a554c'),
            background: task.done ? '#5a7a6c' : 'transparent',
            cursor: 'pointer', padding: 0,
          }}
        >
          {task.done && <span style={{ color: '#1a1816', fontSize: 12 }}>X</span>}
        </button>
        <div style={{ flex: 1, fontSize: 14, color: task.done ? '#5a554c' : '#e8e3da', textDecoration: task.done ? 'line-through' : 'none' }}>
          {task.text}
        </div>
        <button onClick={onDelete} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 16, padding: 0, lineHeight: 1 }}>x</button>
      </div>
      <div style={{ marginTop: 8, marginLeft: 28, position: 'relative' }}>
        <button
          onClick={() => setShowStatus(!showStatus)}
          style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 11, color: statusInfo.color, display: 'flex', alignItems: 'center', gap: 5, padding: 0 }}
        >
          <span style={{ width: 7, height: 7, borderRadius: '50%', background: statusInfo.color, display: 'inline-block' }}></span>
          {statusInfo.label}
        </button>
        {showStatus && (
          <div style={{ position: 'absolute', top: 18, left: 0, background: '#232020', border: '1px solid #2a2722', borderRadius: 6, padding: 6, zIndex: 10, display: 'flex', flexDirection: 'column', gap: 4 }}>
            {STATUSES.map(s => (
              <button
                key={s.id}
                onClick={() => { onStatus(s.id); setShowStatus(false); }}
                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 12, color: s.color, textAlign: 'left', padding: '4px 8px', whiteSpace: 'nowrap' }}
              >
                {s.label}
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function PrepView(props) {
  const names = props.names;
  const sheets = [
    Object.assign({}, CHEAT_SHEET.editor1, { name: names.editor1, day: 'Wednesday' }),
    Object.assign({}, CHEAT_SHEET.editor2, { name: names.editor2, day: 'Thursday' }),
  ];
  return (
    <div>
      <div style={{ fontSize: 13, color: '#5a554c', marginBottom: 16 }}>
        Weekly 1:1 cheat sheet, glance before each conversation.
      </div>
      {sheets.map((sheet, idx) => (
        <div key={idx} style={{ marginBottom: 28 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4 }}>
            <div style={{ fontSize: 16, fontWeight: 600 }}>{sheet.name}</div>
            <div style={{ fontSize: 12, color: '#5a554c' }}>{sheet.day}</div>
          </div>
          <div style={{ fontSize: 12, color: '#8a8478', marginBottom: 10, fontStyle: 'italic' }}>{sheet.subtitle}</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {sheet.items.map(item => (
              <div key={item.id} style={{ border: '1px solid #2a2722', borderRadius: 6, padding: '10px 12px', background: '#1f1d1a', borderLeft: '3px solid ' + KIND_COLORS[item.kind] }}>
                <div style={{ fontSize: 13.5 }}>{item.q}</div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function ProjectsView(props) {
  const projects = props.projects;
  const addProject = props.addProject;
  const updateProjectStatus = props.updateProjectStatus;
  const updateProjectNotes = props.updateProjectNotes;
  const deleteProject = props.deleteProject;
  const activeProjectId = props.activeProjectId;
  const setActiveProjectId = props.setActiveProjectId;
  const [newProject, setNewProject] = useState('');
  const active = projects.find(p => p.id === activeProjectId);

  if (active) {
    return (
      <div>
        <button onClick={() => setActiveProjectId(null)} style={{ background: 'none', border: 'none', color: '#5a554c', cursor: 'pointer', fontSize: 13, marginBottom: 16, padding: 0 }}>Back to projects</button>
        <div style={{ fontSize: 18, fontWeight: 600, marginBottom: 8 }}>{active.name}</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 16 }}>
          {STATUSES.map(s => (
            <button
              key={s.id}
              onClick={() => updateProjectStatus(active.id, s.id)}
              style={Object.assign({}, navBtn, {
                fontSize: 12, padding: '6px 10px',
                borderColor: active.status === s.id ? s.color : '#2a2722',
                color: active.status === s.id ? s.color : '#a8a092',
              })}
            >
              {s.label}
            </button>
          ))}
        </div>
        <textarea
          value={active.notes}
          onChange={(e) => updateProjectNotes(active.id, e.target.value)}
          placeholder="Notes..."
          style={{ width: '100%', minHeight: 160, resize: 'vertical' }}
        />
        <button
          onClick={() => deleteProject(active.id)}
          style={{ ...navBtn, color: '#c4956c', borderColor: '#c4956c', marginTop: 16, width: '100%' }}
        >
          Delete project
        </button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input
          value={newProject}
          onChange={(e) => setNewProject(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') { addProject(newProject); setNewProject(''); } }}
          placeholder="New project name..."
          style={{ flex: 1 }}
        />
        <button
          style={{ ...navBtn, color: '#7a9b8e', borderColor: '#7a9b8e' }}
          onClick={() => { addProject(newProject); setNewProject(''); }}
        >
          Add
        </button>
      </div>
      {projects.length === 0 && (
        <div style={{ color: '#5a554c', fontSize: 13, padding: '20px 0', textAlign: 'center' }}>No projects yet.</div>
      )}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {projects.map(p => {
          const statusInfo = STATUSES.find(s => s.id === p.status) || STATUSES[0];
          return (
            <button
              key={p.id}
              onClick={() => setActiveProjectId(p.id)}
              style={{
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                border: '1px solid #2a2722', borderRadius: 6, padding: '12px 14px',
                background: '#1f1d1a', cursor: 'pointer', textAlign: 'left', color: '#e8e3da',
              }}
            >
              <span style={{ fontSize: 14 }}>{p.name}</span>
              <span style={{ fontSize: 11, color: statusInfo.color, display: 'flex', alignItems: 'center', gap: 5 }}>
                <span style={{ width: 7, height: 7, borderRadius: '50%', background: statusInfo.color, display: 'inline-block' }}></span>
                {statusInfo.label}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
